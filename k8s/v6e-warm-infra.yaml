apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: tpu-warm-holder
value: -100
globalDefault: false
description: "Low-priority warm-holder pods that trigger Spot/Flex autoscaling and yield immediately to real TPU workloads."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: tpu-serving-workload
value: 1000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: "High-priority TPU serving workloads that immediately preempt tpu-warm-holder pods."
---
# Zero-TPU DaemonSet that locks every provisioned v6e node in us-east5-b against scale-down
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pin-v6e-eb-nodes
  namespace: default
spec:
  selector:
    matchLabels:
      app: pin-v6e-eb-nodes
  template:
    metadata:
      labels:
        app: pin-v6e-eb-nodes
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: cloud.google.com/gke-nodepool
                operator: In
                values:
                - tpu-v6e-32-spot-pool
                - tpu-v6e-16-spot-pool
                - tpu-v6e-32-flex-pool
                - tpu-v6e-16-flex-pool
      tolerations:
      - key: google.com/tpu
        operator: Exists
        effect: NoSchedule
      - key: cloud.google.com/gke-queued
        operator: Exists
        effect: NoSchedule
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
---
# Continuous Spot capacity trigger & holder for 32-chip (4x8) v6e in us-east5-b
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warm-hold-v6e-32-spot-eb
  namespace: default
spec:
  replicas: 8
  selector:
    matchLabels:
      app: warm-hold-v6e-32-spot-eb
  template:
    metadata:
      labels:
        app: warm-hold-v6e-32-spot-eb
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      priorityClassName: tpu-warm-holder
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v6e-32-spot-pool
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: 4x8
      tolerations:
      - key: google.com/tpu
        operator: Exists
        effect: NoSchedule
      containers:
      - name: holder
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            google.com/tpu: "4"
          limits:
            google.com/tpu: "4"
---
