apiVersion: batch/v1
kind: Job
metadata:
  name: stage-hf-ltx25-bf16
  namespace: default
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        gke-gcsfuse/volumes: "true"
        gke-gcsfuse/memory-limit: "0"
    spec:
      serviceAccountName: default
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      restartPolicy: OnFailure
      containers:
      - name: downloader
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -e
          pip install -q -U huggingface_hub filelock
          python3 -u -c '
          import filelock, time
          class DummyLock:
              def __init__(self, *args, **kwargs): pass
              def __enter__(self): return self
              def __exit__(self, *args): pass
              def acquire(self, *args, **kwargs): pass
              def release(self, *args, **kwargs): pass
          filelock.FileLock = DummyLock
          filelock.SoftFileLock = DummyLock
          from huggingface_hub import snapshot_download
          t0 = time.time()
          print("Staging LTX-2.5 Diffusers configs from Rin247/LTX-2.5-Diffusers ...", flush=True)
          snapshot_download(
              repo_id="Rin247/LTX-2.5-Diffusers",
              local_dir="/models/models/Lightricks/LTX-2.5/diffusers_configs",
              allow_patterns=["*.json", "*.jinja", "processor/*", "scheduler/*"],
              max_workers=4,
          )
          print("Staging LTX-2.5 22B BF16 weights from comfyicu/LTX-2.5 ...", flush=True)
          path = snapshot_download(
              repo_id="comfyicu/LTX-2.5",
              local_dir="/models/models/Lightricks/LTX-2.5",
              allow_patterns=["*bf16*", "README.md"],
              max_workers=6,
          )
          print(f"DONE LTX-2.5 BF16 -> {path} in {time.time()-t0:.1f}s", flush=True)
          '
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-secret
              key: HF_TOKEN
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 12Gi
        volumeMounts:
        - name: model-weights
          mountPath: /models
      volumes:
      - name: model-weights
        csi:
          driver: gcsfuse.csi.storage.gke.io
          volumeAttributes:
            bucketName: YOUR_GCS_BUCKET
            mountOptions: "implicit-dirs"
